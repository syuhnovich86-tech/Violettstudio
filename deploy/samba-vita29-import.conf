[iphone-import]
    comment = Vita29 private iPhone import
    path = /srv/vita29/import/iphone
    browseable = yes
    read only = no
    guest ok = no
    valid users = vitaiphone
    force group = vita29data
    create mask = 0660
    force create mode = 0660
    directory mask = 2770
    force directory mode = 2770
    hide unreadable = yes
    veto files = /.duplicates/.errors/
    delete veto files = no
    hosts allow = 192.168.1.0/24 127.0.0.1
    hosts deny = 0.0.0.0/0
