services:
  app:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file: .env
    volumes:
      - ${VITA29_APP_DATA_PATH:-/srv/vita29/app-data}:/data/app
      - ${VITA29_MEDIA_PATH:-/srv/vita29/media}:/data/media
      - ${VITA29_GEONAMES_PATH:-/srv/vita29/geonames}:/data/geonames:ro
      - /opt/vita29/secrets:/run/secrets:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  importer:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "vita29.importer"]
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    env_file: .env
    volumes:
      - ${VITA29_APP_DATA_PATH:-/srv/vita29/app-data}:/data/app
      - ${VITA29_MEDIA_PATH:-/srv/vita29/media}:/data/media
      - ${VITA29_IMPORT_PATH:-/srv/vita29/import/iphone}:/data/import/iphone
      - ${VITA29_GEONAMES_PATH:-/srv/vita29/geonames}:/data/geonames:ro
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      # Internal origin for Tailscale Funnel; never exposed on LAN or WAN.
      - "127.0.0.1:${VITA29_HTTP_PORT:-8080}:8080"
      - "${VITA29_LAN_IP:-192.168.1.212}:80:80"
      - "${VITA29_LAN_IP:-192.168.1.212}:443:443"
      - "${VITA29_LAN_IP:-192.168.1.212}:443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  caddy_data:
  caddy_config:
