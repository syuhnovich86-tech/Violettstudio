<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Violetta Analytics — обновление VK</title><link rel="stylesheet" href="./style.css"></head><body><main><h1>Обновление статистики VK</h1><p>Откройте аналитику студии, выберите ВКонтакте и нажмите «Обновить через VK». Введите показанные код и ID сообщества.</p><label>ID сообщества <input id="group" inputmode="numeric" autocomplete="off"></label><p><label>Одноразовый код <input id="code" autocomplete="off" spellcheck="false"></label></p><button id="test">Войти и обновить статистику</button><p id="status" role="status">Данные загружаются только по вашему запросу.</p><p>Ключ VK на сервер не передаётся. Код действует 10 минут и только для одной выгрузки.</p></main><script src="./bundle.js"></script></body></html>
